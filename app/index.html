<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRT 227 Live</title>

  <!-- Leaflet 1.9.4 CSS (CDN, no integrity) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Dark-friendly local styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="title">DRT 227 Live</div>

      <div class="legend">
        <span class="legend-item">
          <span class="legend-swatch legend-solid green"></span> 227A clockwise
        </span>
        <span class="legend-item">
          <span class="legend-swatch legend-dash gray"></span> 227B counter-clockwise
        </span>
        <span class="legend-item">
          <span class="legend-dot"></span> live bus
        </span>
      </div>

      <div class="status-wrap">
        <span id="status-pill" class="status-pill">Loading…</span>
        <div id="last-updated" class="last-updated">—</div>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <!-- Leaflet 1.9.4 JS (CDN, no integrity) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
